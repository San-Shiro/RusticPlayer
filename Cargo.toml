[workspace]
resolver = "2"
members = [
    "crates/rustic_core",
    "crates/audio",
    "crates/platform",
    "crates/engine",
    "crates/cli",
    "crates/app",
    "crates/sources",
    "crates/jam",
    "crates/services",
    "crates/ui-kit",
]
exclude = ["hummingbird"]

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
